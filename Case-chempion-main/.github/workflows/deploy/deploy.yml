name: Deploy Website to RuWeb via FTP

on:
  push:
    branches:
      - main  # Название вашей главной ветки (может быть master, проверьте у себя)

jobs:
  web-deploy:
    name: Deploying...
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
    
    - name: Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # Если ваш FTP-пользователь в ISPmanager смотрит сразу в папку сайта, 
        # оставляем значение './'. Если в корень всего хостинга, раскомментируйте 
        # строку ниже и укажите путь, например: server-dir: www/мойсайт.ру/
        server-dir: ./  
